<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AI 本地路线智能规划系统</title>

  <!-- Leaflet 地图样式：通过 CDN 在线加载 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- 本项目自己的页面样式 -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
  <main class="page">
    <section class="hero">
      <h1>AI 本地路线智能规划系统</h1>
      <p>核心引擎 MVP：输入起点与偏好，自动生成三种杭州本地路线方案。</p>
    </section>

    <section class="panel">
      <h2>输入出行需求</h2>

      <div class="form-grid">
        <label>
          起点坐标 lng,lat
          <input id="start" value="120.1551,30.2741">
        </label>

        <label>
          用户意图
          <input id="user_input" value="周末想在杭州轻松逛逛，吃点本地特色">
        </label>

        <label>
          菜系偏好
          <input id="food" value="杭帮菜">
        </label>

        <label>
          偏好标签
          <input id="tags" value="本地风味,放松">
        </label>

        <label>
          预算上限（元）
          <input id="budget" type="number" value="300">
        </label>

        <label>
          最大排队时间（分钟）
          <input id="max_wait" type="number" value="30">
        </label>

        <label>
          开始时间
          <input id="start_time" value="10:00">
        </label>

        <label>
          结束时间
          <input id="end_time" value="18:00">
        </label>

        <label>
          预计游玩时长（分钟）
          <input id="duration_minutes" type="number" value="240">
        </label>

        <label>
          希望 POI 数量（可不填，系统自动计算）
          <input id="poi_count" type="number" placeholder="例如 3">
        </label>

        <label>
          出行方式
          <select id="transport">
            <option value="walk">步行</option>
            <option value="bike">骑行</option>
            <option value="drive">驾车</option>
          </select>
        </label>
      </div>

      <button id="generateBtn">生成路线</button>
      <p id="status"></p>
    </section>

    <section class="panel">
      <h2>三方案结果</h2>
      <div id="results" class="cards"></div>
    </section>

    <section class="panel">
      <h2>路线地图</h2>
      <p class="map-hint">点击某个方案卡片中的"在地图中查看"，下方地图会显示该方案的 POI 点位和路线连线。</p>
      <div id="map"></div>
    </section>
  </main>

  <!-- Leaflet 地图功能：通过 CDN 在线加载 -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- 本项目脚本（按依赖顺序） -->
  <script src="{{ url_for('static', filename='js/config.js') }}"></script>
  <script src="{{ url_for('static', filename='js/map.js') }}"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>

  <script>
    // 页面加载时初始化地图
    initMap();
  </script>
</body>
</html>
